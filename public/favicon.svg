<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark background -->
  <rect width="64" height="64" fill="#1A1814"/>
  <!-- Gold decorative line under A (matches site's gold wave) -->
  <rect x="20" y="52" width="24" height="1.5" fill="#CBB283" opacity="0.7"/>
  <!-- Letter A in Cinzel/serif style -->
  <text
    x="32"
    y="50"
    text-anchor="middle"
    font-family="Cinzel, Didot, 'Bodoni MT', 'Times New Roman', Georgia, serif"
    font-size="40"
    font-weight="400"
    letter-spacing="2"
    fill="#CBB283"
  >A</text>
</svg>
